[project]
name = "alloy"
version = "0.1.0"
description = "Find why published results disagree, reproduce the gap, and test whether combining methods beats both."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "networkx>=3.2",
    "nbformat>=5.10",
    "numpy>=1.26",
    "pandas>=2.0",
    "pydantic>=2.6",
    "pysindy>=2.1",
    "python-dotenv>=1.0",
    "scipy>=1.11",
    "streamlit>=1.35",
]

[project.optional-dependencies]
coatings = ["tmm>=0.2"]

[project.scripts]
alloy = "alloy.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alloy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
